<svg viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- SOFiSTiK group label -->
  <text x="640" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#2d4373">SOFiSTiK</text>

  <!-- Box 1: Single Point of Truth -->
  <rect x="30" y="185" width="175" height="90" rx="6" fill="#2d4373"/>
  <text x="117" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Single Point</text>
  <text x="117" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">of Truth</text>
  <text x="117" y="256" text-anchor="middle" font-size="12" fill="#c9d3e6">Segment parameters</text>
  <text x="117" y="270" text-anchor="middle" font-size="12" fill="#c9d3e6">(geometry, loads, rebar)</text>

  <!-- Box 2: Python model generation -->
  <rect x="262" y="185" width="165" height="90" rx="6" fill="#2d4373"/>
  <text x="344" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Python</text>
  <text x="344" y="236" text-anchor="middle" font-size="12" fill="#c9d3e6">Model generation</text>
  <text x="344" y="253" text-anchor="middle" font-size="12" fill="#c9d3e6">reads params, builds</text>
  <text x="344" y="267" text-anchor="middle" font-size="12" fill="#c9d3e6">SOFiSTiK input</text>

  <!-- Light boxes: SOFiSTiK steps -->
  <rect x="490" y="115" width="300" height="55" rx="6" fill="#f0f0f0" stroke="#ddd"/>
  <text x="640" y="147" text-anchor="middle" font-size="14" fill="#2d4373">FE / Structural Model</text>

  <rect x="490" y="212" width="300" height="55" rx="6" fill="#f0f0f0" stroke="#ddd"/>
  <text x="640" y="244" text-anchor="middle" font-size="14" fill="#2d4373">Loads &amp; Load Combinations</text>

  <rect x="490" y="309" width="300" height="55" rx="6" fill="#f0f0f0" stroke="#ddd"/>
  <text x="640" y="341" text-anchor="middle" font-size="14" fill="#2d4373">Design / Reinforcement Check</text>

  <!-- Box 4: Python postprocessing -->
  <rect x="900" y="185" width="180" height="90" rx="6" fill="#2d4373"/>
  <text x="990" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Python</text>
  <text x="990" y="240" text-anchor="middle" font-size="12" fill="#c9d3e6">Postprocessing</text>
  <text x="990" y="256" text-anchor="middle" font-size="12" fill="#c9d3e6">extracts results,</text>
  <text x="990" y="270" text-anchor="middle" font-size="12" fill="#c9d3e6">checks, generates reports</text>

  <!-- Arrow: box1 -> box2 -->
  <path d="M205,230 L256,230" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Fan-out: box2 -> three light boxes -->
  <path d="M427,220 C 455,220 460,142 484,142" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M427,230 L484,239" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M427,240 C 455,240 460,336 484,336" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Fan-in: three light boxes -> box4 -->
  <path d="M790,142 C 830,142 850,220 896,225" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,239 L896,232" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,336 C 830,336 850,250 896,238" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
