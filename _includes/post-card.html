<li>
  {% assign date_format = site.minima.date_format | default: "%b %-d, %Y" %}
  <span class="post-meta">{{ include.post.date | date: date_format }}</span>
  <h3>
    <a class="post-link" href="{{ include.post.url | relative_url }}">
      {{ include.post.title | escape }}
    </a>
  </h3>
  {% if site.show_excerpts %}
    {{ include.post.excerpt }}
  {% endif %}
  {% if include.post.image %}
    <a href="{{ include.post.url | relative_url }}">
      <img class="post-thumbnail" src="{{ include.post.image | relative_url }}" alt="{{ include.post.title | escape }}">
    </a>
  {% endif %}
</li>
